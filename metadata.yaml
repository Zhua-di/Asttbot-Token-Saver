name: astrbot_plugin_super_saver
display_name: 超节省群聊
desc: 省 token 的群聊机器人调度插件。关键词唤醒 + 固定时长会话窗口（到点即止）；窗口内先判断"这句是不是在跟她说"才接话，群友之间聊天不插嘴；窗口结束后再被叫醒会先愣神。自带回复间隔、每分钟回复上限、每分钟判断上限，超限让她自己说一句困了并静默。
short_desc: 关键词唤醒 + 会话窗口 + 插嘴判断 + 多重限流
author: dsh
version: 1.5.1
repo: https://github.com/
category: 对话
tags:
  - 群聊
  - 唤醒
  - 会话窗口
  - 省token
  - 发言限流
help: |
  - 命中关键词或 @ 机器人 → 开启会话窗口（默认 5 分钟，到点立刻结束）
  - 窗口内先判断这句是不是在跟机器人说话，不是就不插嘴
  - 窗口结束后再叫她 → 先"愣神"一下再接话
  - 两次回复至少间隔 8 秒
  - 一分钟最多 5 条，超了会用自己的语气说困了，然后静默 120 秒（期间 @ 也不回）
  - 每分钟最多做 10 次判断，控制额外开销
  - 私聊不受影响，始终回复

  所有参数都在插件配置里改。
astrbot_version: ">=4.24.0"
support_platforms:
  - aiocqhttp